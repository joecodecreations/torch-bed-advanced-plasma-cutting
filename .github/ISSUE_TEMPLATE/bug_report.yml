name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and browser
  - type: input
    attributes:
      label: Controller board and firmware
      description: For example "Uno + CNC Shield V3, grbl-1.1h-corexy". "Simulator" is fine.
  - type: textarea
    attributes:
      label: Controller messages
      description: Copy the text from Setup > Controller messages, if relevant.
      render: text
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: This involved unexpected motion or the torch firing when it should not have
